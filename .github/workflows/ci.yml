name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0 # no moving "v10" tag is published
        with:
          enable-cache: true

      # GPT-2 weights (~550 MB) for the golden tests; cached between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-openai-community-gpt2

      - name: Install (exact versions from uv.lock)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test (CPU only; MPS tests skip automatically)
        run: uv run pytest -v
